<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codeviz</title>
<style>/*__STYLE__*/</style>
<style>
  body.start { overflow: auto; display: block; }
  .start-wrap { max-width: 640px; margin: 0 auto; padding: 56px 24px 40px; }
  .start-wrap h1 { font-size: 26px; margin: 0 0 6px; display: flex; align-items: center; gap: 10px; }
  .start-wrap h1 .logo { color: var(--accent); }
  .start-wrap .lead { color: var(--muted); margin: 0 0 28px; line-height: 1.5; }
  .open-row { display: flex; gap: 8px; }
  .open-row input { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--fg); font: 13px var(--mono); }
  .open-row input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.primary { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 9px 16px;
    font: 600 14px var(--sans); cursor: pointer; }
  [data-theme="dark"] button.primary, .dark button.primary { color: #10131a; }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.ghost { background: none; border: 1px solid var(--border); color: var(--fg); border-radius: 6px;
    padding: 8px 12px; font: 13px var(--sans); cursor: pointer; }
  button.ghost:hover { background: var(--hover); }
  .big-open { width: 100%; padding: 16px; font-size: 16px; margin-bottom: 12px; }
  .or { color: var(--muted); font-size: 12px; margin: 14px 0 8px; }
  .status { margin-top: 22px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-2); }
  .status .what { font-weight: 600; margin-bottom: 8px; word-break: break-all; }
  .bar { height: 6px; border-radius: 3px; background: var(--bg-3); overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  .bar.indet > div { width: 30%; animation: slide 1.1s infinite ease-in-out; }
  @keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
  .status .sub { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .status.error { border-color: var(--warn); }
  .status.error .what { color: var(--warn); }
  .status pre { font: 11px var(--mono); white-space: pre-wrap; max-height: 200px; overflow: auto; color: var(--muted); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 34px 0 8px; }
  .recent { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .recent:empty::after { content: "Folders you open show up here."; display: block; padding: 12px 14px; color: var(--muted); }
  .recent li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--border); cursor: pointer; }
  .recent li:first-child { border-top: 0; }
  .recent li:hover { background: var(--hover); }
  .recent li.missing { cursor: default; opacity: .55; }
  .recent .nm { font-weight: 600; }
  .recent .pth { color: var(--muted); font: 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .recent .x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 0 4px; visibility: hidden; }
  .recent li:hover .x { visibility: visible; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 28px; line-height: 1.5; }
  kbd { font: 11px var(--mono); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body class="start">
<div class="start-wrap">
  <h1><span class="logo">⟡</span> codeviz</h1>
  <p class="lead">Open a folder to see every function in it as a call graph you can click through.</p>
  <button id="pick" class="primary big-open">Open folder…</button>
  <div class="or">or paste a path</div>
  <form id="path-form" class="open-row">
    <input id="path" placeholder="/path/to/project" autocomplete="off" spellcheck="false">
    <button class="ghost" type="submit">Open</button>
  </form>
  <div id="status" class="status" hidden></div>
  <h2>Recent</h2>
  <ul id="recent" class="recent"></ul>
  <p class="hint">Shortcut: <kbd>Ctrl</kbd>/<kbd>⌘</kbd>+<kbd>O</kbd> opens a folder from any page.
    Scanning runs on this computer; nothing is uploaded.</p>
</div>
<script>
(function () {
  try {
    const t = JSON.parse(localStorage.getItem("codeviz-prefs") || "{}").theme;
    if (t) document.documentElement.dataset.theme = t;
  } catch { /* ignore */ }
  const $ = (s) => document.querySelector(s);
  const api = (path, body) => fetch("api/" + path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  }).then((r) => r.json());
  let busy = false;

  function setBusy(b) { busy = b; $("#pick").disabled = b; }
  function showStatus(cls, what, sub, pct, detail) {
    const s = $("#status");
    s.hidden = false; s.className = "status " + cls; s.textContent = "";
    const w = document.createElement("div"); w.className = "what"; w.textContent = what; s.append(w);
    if (cls === "running") {
      const bar = document.createElement("div"); bar.className = "bar" + (pct == null ? " indet" : "");
      const fill = document.createElement("div"); if (pct != null) fill.style.width = pct + "%";
      bar.append(fill); s.append(bar);
    }
    if (sub) { const d = document.createElement("div"); d.className = "sub"; d.textContent = sub; s.append(d); }
    if (detail) { const p = document.createElement("pre"); p.textContent = detail; s.append(p); }
  }

  async function open(path) {
    if (busy || !path) return;
    setBusy(true);
    const name = path.replace(/[\\/]+$/, "").split(/[\\/]/).pop() || path;
    showStatus("running", "Scanning " + name + "…", "Finding source files", null);
    try {
      const { job, error } = await api("scan", { path });
      if (error) throw new Error(error);
      for (;;) {
        await new Promise((r) => setTimeout(r, 150));
        const j = await api("job/" + job);
        if (j.state === "done") { location.href = j.url; return; }
        if (j.state === "error") { showStatus("error", "Couldn’t open " + name, j.error, null, j.detail); break; }
        if (j.total) {
          const pct = Math.round((100 * j.done) / j.total);
          showStatus("running", "Scanning " + name + "…", `Parsing ${j.done} of ${j.total} files`, pct);
        }
      }
    } catch (e) {
      showStatus("error", "Couldn’t open " + name, String(e.message || e));
    }
    setBusy(false);
    loadRecent();
  }

  async function pick() {
    if (busy) return;
    const r = await api("pick", {});
    if (r.unsupported) { $("#path").focus(); return; }  // plain browser: no native dialog
    if (r.path) open(r.path);
  }

  async function loadRecent() {
    const ul = $("#recent");
    const items = await api("recent");
    ul.textContent = "";
    for (const it of items) {
      const li = document.createElement("li");
      li.title = it.exists ? "Open " + it.path : "This folder no longer exists";
      if (!it.exists) li.className = "missing";
      const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = it.name;
      const p = document.createElement("span"); p.className = "pth"; p.textContent = it.path;
      const x = document.createElement("button"); x.className = "x"; x.textContent = "×"; x.title = "Remove from the list";
      x.onclick = async (e) => { e.stopPropagation(); await api("forget", { path: it.path }); loadRecent(); };
      li.append(nm, p, x);
      if (it.exists) li.onclick = () => open(it.path);
      ul.append(li);
    }
  }

  $("#pick").onclick = pick;
  $("#path-form").onsubmit = (e) => { e.preventDefault(); open($("#path").value.trim()); };
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "o") { e.preventDefault(); pick(); }
  });
  loadRecent();
  const m = /^#open=(.+)/.exec(location.hash);
  if (m) { history.replaceState(null, "", location.pathname); open(decodeURIComponent(m[1])); }
  else if (location.hash === "#pick") { history.replaceState(null, "", location.pathname); pick(); }
})();
</script>
</body>
</html>
