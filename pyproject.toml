[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeviz"
version = "0.1.0"
description = "Turn a codebase into an interactive, clickable call tree in one HTML file"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tree-sitter>=0.23", "tree-sitter-language-pack>=0.7"]

[project.optional-dependencies]
test = ["pytest>=7"]
desktop = ["pywebview>=5"]

[project.scripts]
codeviz = "codeviz.cli:main"

[project.gui-scripts]
codeviz-app = "codeviz.desktop:main"

[tool.setuptools]
packages = ["codeviz", "codeviz.desktop"]

[tool.setuptools.package-data]
codeviz = ["viewer/*", "desktop/*.html", "desktop/*.js"]
