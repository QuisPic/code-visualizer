name: Desktop app

# Builds the codeviz desktop app for Windows and macOS on every push and pull request; the installers
# are attached to the run as artifacts. Pushing a tag like v0.1.0, or running the workflow by hand with a
# version, also publishes them as a GitHub release (the release creates the tag when it doesn't exist).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a release with this version, e.g. 0.1.0 (empty: build only)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install ".[test,desktop]" pyinstaller pillow

      - name: Test
        run: python -m pytest -q

      - name: Bundle tree-sitter grammars
        run: python packaging/fetch_grammars.py build/grammars

      - name: Build app
        run: pyinstaller packaging/codeviz.spec --noconfirm

      - name: Check the packaged app (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          APP=dist/codeviz.app/Contents/MacOS/codeviz
          "$APP" --self-test
          "$APP" --smoke-test smoke.txt tests/fixtures/mixed || true
          cat smoke.txt
          grep -qx ok smoke.txt

      - name: Check the packaged app (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process "$PWD\dist\codeviz\codeviz.exe" -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
          $p = Start-Process "$PWD\dist\codeviz\codeviz.exe" -ArgumentList '--smoke-test','smoke.txt','tests\fixtures\mixed' -Wait -PassThru
          Get-Content smoke.txt
          if ((Get-Content smoke.txt -Raw).Trim() -ne 'ok') { throw "smoke test failed" }

      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/dmg
          cp -R dist/codeviz.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname codeviz -srcfolder build/dmg -ov -format UDZO "dist/codeviz-${{ matrix.name }}.dmg"

      - name: Package (Windows installer and zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('packaging/icon.png').save('build/icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$version" packaging\windows.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Move-Item dist\codeviz-setup.exe dist\codeviz-${{ matrix.name }}-setup.exe
          Compress-Archive -Path dist\codeviz -DestinationPath dist\codeviz-${{ matrix.name }}-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: codeviz-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
