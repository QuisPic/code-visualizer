name: Desktop app

# Builds the codeviz desktop app for Windows, macOS and Linux on every push and pull request; the installers
# are attached to the run as artifacts. Pushing a tag like v0.1.0, or running the workflow by hand with a
# version, also publishes them as a GitHub release (the release creates the tag when it doesn't exist).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a release with this version, e.g. 0.1.0 (empty: build only)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
          - os: ubuntu-22.04  # oldest supported runner, so the app runs on glibc 2.35+ distros
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          # Qt's X11 platform plugin and Qt WebEngine load these; PyInstaller bundles them. xvfb runs the smoke test.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libasound2

      - name: Install
        run: python -m pip install ".[test,desktop]" pyinstaller pillow

      - name: Test
        run: python -m pytest -q

      - name: Bundle tree-sitter grammars
        run: python packaging/fetch_grammars.py build/grammars

      - name: Build app
        run: pyinstaller packaging/codeviz.spec --noconfirm

      - name: Check the packaged app (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          APP=dist/codeviz.app/Contents/MacOS/codeviz
          "$APP" --self-test
          "$APP" --smoke-test smoke.txt tests/fixtures/mixed || true
          cat smoke.txt
          grep -qx ok smoke.txt

      - name: Check the packaged app (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process "$PWD\dist\codeviz\codeviz.exe" -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
          $p = Start-Process "$PWD\dist\codeviz\codeviz.exe" -ArgumentList '--smoke-test','smoke.txt','tests\fixtures\mixed' -Wait -PassThru
          Get-Content smoke.txt
          if ((Get-Content smoke.txt -Raw).Trim() -ne 'ok') { throw "smoke test failed" }

      - name: Check the packaged app (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          dist/codeviz/codeviz --self-test
          xvfb-run -a dist/codeviz/codeviz --smoke-test smoke.txt tests/fixtures/mixed || true
          cat smoke.txt
          grep -qx ok smoke.txt

      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/dmg
          cp -R dist/codeviz.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname codeviz -srcfolder build/dmg -ov -format UDZO "dist/codeviz-${{ matrix.name }}.dmg"

      - name: Package (Windows installer and zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('packaging/icon.png').save('build/icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$version" packaging\windows.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Move-Item dist\codeviz-setup.exe dist\codeviz-${{ matrix.name }}-setup.exe
          Compress-Archive -Path dist\codeviz -DestinationPath dist\codeviz-${{ matrix.name }}-portable.zip

      - name: Package (Linux AppImage and tarball)
        if: runner.os == 'Linux'
        run: |
          packaging/linux/build-appimage.sh ${{ matrix.name }}
          APPIMAGE_EXTRACT_AND_RUN=1 dist/codeviz-${{ matrix.name }}.AppImage --self-test

      - uses: actions/upload-artifact@v4
        with:
          name: codeviz-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  # The Linux build is made on the oldest runner; check that it also starts on the newest one.
  linux-newer:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: codeviz-linux-x64
          path: dist
      - name: Check the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          # PyInstaller leaves out the graphics stack (GL, EGL, DRM, Wayland), which must match the system's
          # drivers; every desktop has it, a bare runner doesn't
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libgbm1 libdrm2 libxcb-dri3-0 \
            libwayland-client0 libwayland-server0 libwayland-cursor0 libwayland-egl1 libgl1-mesa-dri
          chmod +x dist/codeviz-linux-x64.AppImage
          dist/codeviz-linux-x64.AppImage --self-test
          # Ubuntu 24.04+ blocks the user namespaces Qt WebEngine's sandbox needs (the app then opens the browser
          # instead); lift that here, as a user with an AppArmor profile or an older distro has it, to check the window
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a dist/codeviz-linux-x64.AppImage --smoke-test smoke.txt tests/fixtures/mixed || true
          cat smoke.txt
          grep -qx ok smoke.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
